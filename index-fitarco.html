<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Iscrizioni Gare | Tiro con l'Arco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #b02a37; --bg-accent: #fdf2f2; }
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; color: #333; }
        .theme-header { background: var(--primary-color); color: white; padding: 20px; border-radius: 12px; }
        .registration-card { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: none; }
        .form-label { font-weight: 600; font-size: 0.85rem; color: #495057; }
        .table thead th { background: var(--bg-accent); font-size: 0.75rem; text-transform: uppercase; color: #495057; }
    </style>
</head>
<body>
<div class="container py-5">
    
    <div class="theme-header text-center mb-4 shadow-sm">
        <h2 class="fw-bold m-0" id="nomeGaraTitolo">Caricamento Competizione...</h2>
        <small class="text-white-50 text-uppercase fw-bold tracking-wide">Modulo d'Iscrizione Ufficiale - FITARCO</small>
    </div>

    <div class="row justify-content-center mb-5">
        <div class="col-lg-8">
            <div class="card registration-card p-4">
                <form id="registrationForm">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Nome Arciere</label>
                            <input type="text" id="regFirstName" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Cognome Arciere</label>
                            <input type="text" id="regLastName" class="form-control" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Divisione di Tiro</label>
                            <select id="regSpecialty" class="form-select" required>
                                <option value="">-- Seleziona Divisione --</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Classe Atleta</label>
                            <select id="regClasse" class="form-select" required disabled>
                                <option value="">-- Scegli prima la divisione --</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label">Sesso</label>
                            <select id="regGender" class="form-select" required>
                                <option value="M">Maschile (M)</option>
                                <option value="F">Femminile (F)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Categoria Distanza / Bersaglio</label>
                            <input type="text" id="regWeightCategory" class="form-control" value="Standard Fitarco" readonly>
                        </div>
                    </div>

                    <input type="hidden" id="regBelt" value="Atleta Nazionale">

                    <button type="submit" class="btn btn-danger w-100 fw-bold py-2 shadow-sm">REGISTRA ISCRIZIONE ARCIERE</button>
                </form>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-12">
            <h4 class="fw-bold text-dark mb-3">Arcieri Iscritti alla Competizione</h4>
            <div class="table-responsive bg-white p-3 rounded-3 shadow-sm border">
                <table class="table table-hover align-middle m-0">
                    <thead>
                        <tr>
                            <th>Arciere</th>
                            <th>Divisione</th>
                            <th>Classe</th>
                            <th>Sesso</th>
                            <th>Nota Categoria</th>
                        </tr>
                    </thead>
                    <tbody id="iscrittiGaraList">
                        <tr><td colspan="5" class="text-center text-muted py-3">Nessun arciere registrato.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script src="script2.js"></script>
</body>
</html>
