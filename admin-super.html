<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Pannello Super Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-4"><span class="navbar-brand mb-0 h1">Pannello di Gestione Avanzata</span></nav>
<div class="container py-4">
    <div class="row">
        <div class="col-md-5 mb-4">
            <div class="card p-3 shadow-sm">
                <h5 class="fw-bold text-primary mb-3">Crea Evento Competitivo</h5>
                <form id="adminEventForm">
                    <div class="mb-2"><label class="form-label">Nome Gara</label><input type="text" id="addNome" class="form-control" required></div>
                    <div class="mb-2"><label class="form-label">Data</label><input type="date" id="addData" class="form-control" required></div>
                    <div class="mb-2"><label class="form-label">Luogo</label><input type="text" id="addLuogo" class="form-control" required></div>
                    <div class="mb-3">
                        <label class="form-label">Disciplina Associata</label>
                        <select id="addSportId" class="form-select" required>
                            <option value="judo">JUDO (FIJLKAM)</option>
                            <option value="fitarco">TIRO CON L'ARCO (FITARCO)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">SALVA E PUBBLICA GARA</button>
                </form>
            </div>
            
            <div class="card p-3 shadow-sm mt-4 border-danger">
                <h5 class="fw-bold text-danger mb-2">Editor Regolamenti a Cascata</h5>
                <p class="small text-muted">Configura l'albero delle categorie senza modificare i file del codice.</p>
                <button class="btn btn-outline-danger w-100" onclick="apriEditorModale()">APRI EDITOR JSON</button>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card p-3 shadow-sm">
                <h5 class="fw-bold text-dark mb-3">Riepilogo Gare Gestite</h5>
                <div class="list-group" id="listaGareAdmin"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalEditor" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white"><h5 class="modal-title">Gestore Strutture JSON</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Seleziona la Disciplina</label>
                    <select id="selettoreSportJson" class="form-select" onchange="leggiJsonDaDb()"><option value="judo">JUDO</option><option value="fitarco">TIRO CON L'ARCO</option></select>
                </div>
                <div class="mb-2"><label class="form-label">Mappa delle Categorie (Formato JSON Nativo)</label><textarea id="testoJson" class="form-control font-monospace" rows="12" style="font-size:0.85rem; background:#f8f9fa;"></textarea></div>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="formattaTestoJson()">CONVALIDA / FORMATTA</button><button type="button" class="btn btn-danger" onclick="inviaJsonAggiustato()">SALVA REGOLE NEL DB</button></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script src="admin-super.js"></script>
</body>
</html>
