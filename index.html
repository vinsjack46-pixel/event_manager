<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caricamento in corso...</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f8f9fa; margin: 0; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0d6efd; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>

    <script type="module">
        import { supabase } from './supabase-config.js';

        async function checkAuthAndRedirect() {
            try {
                // Recupera la sessione corrente dell'utente da Supabase
                const { data: { session } } = await supabase.auth.getSession();

                if (session) {
                    // Utente autenticato -> Reindirizza a scelta evento
                    window.location.replace('scelta-evento.html');
                } else {
                    // Utente NON autenticato -> Reindirizza al login
                    window.location.replace('login.html');
                }
            } catch (error) {
                console.error("Errore durante il reindirizzamento:", error);
                window.location.replace('login.html');
            }
        }

        checkAuthAndRedirect();
    </script>
    <div class="loader"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
