<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Iscrizioni Società</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1"><i class="fas fa-user-shield me-2"></i>Pannello Iscrizioni Gara</span>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()"><i class="fas fa-sign-out-alt me-1"></i>Esci</button>
        </div>
    </nav>

    <div class="container">
        
        <div class="alert alert-info d-flex justify-content-between align-items-center mb-4">
            <div>
                <i class="fas fa-building me-1"></i> <strong>Società:</strong> <span id="societyNameDisplay">Caricamento...</span>
            </div>
            <div>
                <i class="fas fa-calendar-alt me-1"></i> <strong>Evento:</strong> <span id="eventNameDisplay">Seleziona un evento</span>
            </div>
        </div>

        <div class="row text-center mb-4">
            <div class="col-md-3 mb-2">
                <div class="card shadow-sm border-start border-primary border-4 p-2">
                    <span class="text-muted small text-uppercase font-weight-bold">Iscritti Kata</span>
                    <h3 class="mb-0 text-primary" id="kataAthleteCountDisplay">0</h3>
                </div>
            </div>
            <div class="col-md-3 mb-2">
                <div class="card shadow-sm border-start border-success border-4 p-2">
                    <span class="text-muted small text-uppercase font-weight-bold">Iscritti Kumite</span>
                    <h3 class="mb-0 text-success" id="kumiteAthleteCountDisplay">0</h3>
                </div>
            </div>
            <div class="col-md-3 mb-2">
                <div class="card shadow-sm border-start border-warning border-4 p-2">
                    <span class="text-muted small text-uppercase font-weight-bold">Iscritti ParaKarate</span>
                    <h3 class="mb-0 text-warning" id="ParaKarateAthleteCountDisplay">0</h3>
                </div>
            </div>
            <div class="col-md-3 mb-2">
                <div class="card shadow-sm border-start border-info border-4 p-2">
                    <span class="text-muted small text-uppercase font-weight-bold">Attività KIDS</span>
                    <h3 class="mb-0 text-info" id="KIDSAthleteCountDisplay">0</h3>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-5 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0"><i class="fas fa-plus-circle me-2"></i>Nuova Iscrizione</h5>
                    </div>
                    <div class="card-body">
                        <form id="athleteForm">
                            <input type="hidden" id="selectedEventId" value="">

                            <div class="mb-3">
                                <label class="form-label d-block fw-bold">Tipo di Iscrizione:</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="regType" id="regIndividual" value="individual" checked>
                                    <label class="form-check-label" for="regIndividual">Individuale</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="regType" id="regTeam" value="team">
                                    <label class="form-check-label" for="regTeam">Squadra (Team)</label>
                                </div>
                            </div>

                            <div id="individualFields">
                                <div class="mb-2">
                                    <label for="last_name" class="form-label small mb-1">Cognome</label>
                                    <input type="text" class="form-control" id="last_name" placeholder="Cognome Atleta">
                                </div>
                                <div class="mb-2">
                                    <label for="first_name" class="form-label small mb-1">Nome</label>
                                    <input type="text" class="form-control" id="first_name" placeholder="Nome Atleta">
                                </div>
                                <div class="mb-2">
                                    <label for="birthdate" class="form-label small mb-1">Data di Nascita</label>
                                    <input type="date" class="form-control" id="birthdate">
                                </div>
                                <div class="mb-3">
                                    <label for="gender" class="form-label small mb-1">Sesso</label>
                                    <select class="form-select" id="gender">
                                        <option value="Maschio">Maschio</option>
                                        <option value="Femmina">Femmina</option>
                                    </select>
                                </div>
                            </div>

                            <div id="teamFields" style="display: none;">
                                <div class="mb-2">
                                    <label for="team_name" class="form-label small mb-1">Nome Squadra</label>
                                    <input type="text" class="form-control" id="team_name" placeholder="Es: Ginnastica Roma A">
                                </div>
                                <div class="mb-2">
                                    <label for="team_year" class="form-label small mb-1">Anno di Riferimento Team (Classe d'Età)</label>
                                    <input type="number" class="form-control" id="team_year" placeholder="Es: 2012">
                                </div>
                                <div class="mb-3">
                                    <label for="team_gender" class="form-label small mb-1">Sesso Team</label>
                                    <select class="form-select" id="team_gender">
                                        <option value="Maschio">Maschio</option>
                                        <option value="Femmina">Femmina</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold mb-1">Componenti Squadra (Min 3 / Max 6)</label>
                                    <div id="membersContainer" class="row gx-2"></div>
                                </div>
                            </div>

                            <hr>

                            <div class="row">
                                <div class="col-md-6 mb-2">
                                    <label for="classe" class="form-label small mb-1">Classe d'Età</label>
                                    <input type="text" class="form-control bg-light" id="classe" readonly placeholder="Calcolata in automatico">
                                </div>
                                <div class="col-md-6 mb-2">
                                    <label for="specialty" class="form-label small mb-1">Specialità</label>
                                    <select class="form-select" id="specialty" required>
                                        <option value="">-- Seleziona Anno --</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="belt" class="form-label small mb-1">Grado/Cintura</label>
                                    <select class="form-select" id="belt" required>
                                        <option value="">-- Cintura --</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="weight_category" class="form-label small mb-1">Categoria Peso</label>
                                    <select class="form-select" id="weight_category" disabled>
                                        <option value="-">-</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-paper-plane me-1"></i>Invia Iscrizione</button>
                            <button type="button" class="btn btn-light btn-sm w-100 mt-2" onclick="completeReset()">Annulla / Resetta</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0"><i class="fas fa-list-ul me-2"></i>Atleti Iscritti</h4>
                    <button class="btn btn-success btn-sm" onclick="exportToExcel()"><i class="fas fa-file-excel me-1"></i>Esporta CSV / Excel</button>
                </div>

                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-secondary text-white py-2">
                        <h6 class="mb-0 small text-uppercase font-weight-bold">Atleti Individuali</h6>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0" style="font-size: 0.9rem;">
                            <thead class="table-dark">
                                <tr>
                                    <th>Atleta</th>
                                    <th>Classe</th>
                                    <th>Sesso</th>
                                    <th>Gara</th>
                                    <th>Cintura</th>
                                    <th>Peso</th>
                                    <th class="text-end">Azioni</th>
                                </tr>
                            </thead>
                            <tbody id="athleteList">
                                <tr><td colspan="7" class="text-center text-muted py-3">Nessun atleta iscritto.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white py-2">
                        <h6 class="mb-0 small text-uppercase font-weight-bold">Squadre (Team)</h6>
                    </div>
                    <div class="
