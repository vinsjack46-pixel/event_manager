<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caricamento in corso...</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f8f9fa; margin: 0; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0d6efd; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>

    <!-- 1. Carica la libreria di Supabase da CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2. Carica il tuo script.js dove viene definita l'istanza di supabase -->
    <script src="script.js"></script>

    <!-- 3. Controlla lo stato della sessione e reindirizza -->
    <script>
        async function checkAuthAndRedirect() {
            try {
                // Recupera la sessione dal client supabase creato dentro script.js
                const { data: { session } } = await supabase.auth.getSession();

                if (session) {
                    // Utente già autenticato -> invia alla scelta evento
                    window.location.replace('scelta-evento.html');
                } else {
                    // Utente NON autenticato -> invia al login
                    window.location.replace('login.html');
                }
            } catch (error) {
                console.error("Errore durante il controllo sessione:", error);
                window.location.replace('login.html');
            }
        }

        // Avvia il controllo subito dopo il caricamento della pagina
        window.addEventListener('DOMContentLoaded', checkAuthAndRedirect);
    </script>
</body>
</html>
