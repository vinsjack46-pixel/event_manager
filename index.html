<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iscrizione Gara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8f9fa; }
        .registration-card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .form-label { font-weight: 600; font-size: 0.85rem; color: #444; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="registration-card p-4">
                <h3 class="fw-bold mb-4 text-center">Modulo di Iscrizione</h3>
                
                <form id="registrationForm">
                    <div class="mb-3">
                        <label class="form-label">Seleziona Evento / Gara</label>
                        <select id="regEventId" class="form-select" required onchange="handleEventChange()">
                            <option value="">-- Scegli la gara --</option>
                        </select>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label">Nome</label>
                            <input type="text" id="regFirstName" class="form-control" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Cognome</label>
                            <input type="text" id="regLastName" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Sesso</label>
                        <select id="regGender" class="form-select" required>
                            <option value="M">Maschio</option>
                            <option value="F">Femmina</option>
                        </select>
                    </div>

                    <div id="dynamicFormFields" class="p-3 border rounded bg-light mb-4" style="display:none;">
                        </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2">INVIA ISCRIZIONE</button>
                </form>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script src="index-logic.js"></script>
</body>
</html>
