<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Evento | Gestione Gare</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #1e90ff;
            --bg-color: #f4f7fe;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            min-height: 100vh;
            margin: 0;
            padding-bottom: 40px;
        }

        .navbar-custom {
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 15px 30px;
        }

        .card-stat {
            background: white;
            border: none;
            border-radius: 16px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
            padding: 20px;
            transition: transform 0.2s ease;
        }

        .card-stat:hover {
            transform: translateY(-3px);
        }

        .icon-shape {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .table-container {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
            margin-top: 25px;
        }

        .table thead th {
            background-color: #f8f9fa;
            color: #555;
            font-weight: 600;
            border-bottom: 2px solid #edf2f7;
            padding: 12px 15px;
        }

        .table tbody td {
            padding: 14px 15px;
            vertical-align: middle;
        }

        .badge-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Top Bar Navigation -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2" href="admin.html">
                <i class="fas fa-trophy text-warning"></i>
                <span>Gestionale Gare</span>
            </a>

            <div class="d-flex align-items-center gap-3 ms-auto">
                <!-- Selettore dinamico evento autorizzato -->
                <div class="d-flex align-items-center gap-2">
                    <label for="eventSelector" class="fw-bold text-secondary mb-0 small text-nowrap d-none d-sm-inline">
                        <i class="fas fa-filter me-1"></i>Evento:
                    </label>
                    <select id="eventSelector" class="form-select form-select-sm shadow-sm" style="min-width: 220px; border-radius: 8px;">
                        <option value="">Caricamento eventi...</option>
                    </select>
                </div>

                <a href="admin.html" class="btn btn-outline-secondary btn-sm rounded-3">
                    <i class="fas fa-arrow-left me-1"></i> Dashboard
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container-fluid px-4 mt-4">
        
        <!-- Header Evento -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 id="eventTitle" class="fw-bold mb-1">Seleziona un evento</h3>
                <p id="eventSubtitle" class="text-muted mb-0">Riepilogo e statistiche delle iscrizioni</p>
            </div>
            <button id="btnPrint" class="btn btn-primary rounded-3 shadow-sm" onclick="window.print()">
                <i class="fas fa-print me-2"></i>Stampa Report
            </button>
        </div>

        <!-- KPI Cards -->
        <div class="row g-3">
            <div class="col-md-4">
                <div class="card-stat d-flex align-items-center gap-3">
                    <div class="icon-shape bg-primary bg-opacity-10 text-primary">
                        <i class="fas fa-user-ninja"></i>
                    </div>
                    <div>
                        <span class="text-muted small fw-semibold">Totale Atleti Iscritti</span>
                        <h3 id="statTotalAtleti" class="fw-bold mb-0">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card-stat d-flex align-items-center gap-3">
                    <div class="icon-shape bg-success bg-opacity-10 text-success">
                        <i class="fas fa-building"></i>
                    </div>
                    <div>
                        <span class="text-muted small fw-semibold">Società Partecipanti</span>
                        <h3 id="statTotalSocieta" class="fw-bold mb-0">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card-stat d-flex align-items-center gap-3">
                    <div class="icon-shape bg-warning bg-opacity-10 text-warning">
                        <i class="fas fa-list-ol"></i>
                    </div>
                    <div>
                        <span class="text-muted small fw-semibold">Categorie Attive</span>
                        <h3 id="statTotalCategorie" class="fw-bold mb-0">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Table Data Section -->
        <div class="table-container">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0">Elenco Iscritti</h5>
                <input type="text" id="searchInput" class="form-control form-control-sm w-auto" placeholder="Cerca atleta o società...">
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="reportTable">
                    <thead>
                        <tr>
                            <th>Atleta</th>
                            <th>Società</th>
                            <th>Categoria</th>
                            <th>Sesso</th>
                            <th>Peso</th>
                            <th class="text-center">Stato</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody">
                        <tr>
                            <td colspan="6" class="text-center text-muted py-4">
                                <span class="spinner-border spinner-border-sm me-2"></span>Caricamento report in corso...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

    <!-- Application Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Avvio del processo disaccoppiato dal thread principale
            setTimeout(async () => {
                await inizializzaReport();
            }, 0);
        });

        async function inizializzaReport() {
            const client = window.supabaseClient || window.sb || window.supabase;
            if (!client) {
                alert("Errore di connessione a Supabase.");
                return;
            }

            // 1. Controllo Autenticazione Utente
            const { data: { user }, error: authError } = await client.auth.getUser();
            if (authError || !user) {
                window.location.href = 'login.html';
                return;
            }

            const userEmail = user.email ? user.email.toLowerCase() : '';
            const authorizedAdmins = ["vinsjack46@gmail.com", "19vincenzo89@gmail.com"];
            const isAdmin = authorizedAdmins.includes(userEmail);

            // 2. Lettura parametri URL
            const urlParams = new URLSearchParams(window.location.search);
            let currentEventId = urlParams.get('event_id');

            // 3. Estrazione Eventi Autorizzati in base ai Permessi
            let eventiAutorizzati = [];

            if (isAdmin) {
                const { data: tuttiEventi, error } = await client
                    .from('eventi')
                    .select('id, nome, data_evento')
                    .order('created_at', { ascending: false });
                
                if (!error && tuttiEventi) eventiAutorizzati = tuttiEventi;
            } else {
                const { data: permessi, error: permError } = await client
                    .from('permessi_eventi')
                    .select('event_id, eventi(id, nome, data_evento)')
                    .eq('user_email', userEmail);

                if (!permError && permessi) {
                    eventiAutorizzati = permessi
                        .filter(p => p.eventi)
                        .map(p => p.eventi);
                }
            }

            // Gestione del caso senza autorizzazioni
            if (eventiAutorizzati.length === 0) {
                document.getElementById('reportTableBody').innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-danger py-4">
                            <i class="fas fa-lock fa-2x mb-2 d-block"></i>
                            Non disponi dei permessi per visualizzare i report di alcun evento.
                        </td>
                    </tr>`;
                document.getElementById('eventSelector').innerHTML = '<option value="">Nessun evento disponibile</option>';
                return;
            }

            // Se nessun evento è selezionato nell'URL, imposta il primo disponibile
            if (!currentEventId || !eventiAutorizzati.some(e => String(e.id) === String(currentEventId))) {
                currentEventId = eventiAutorizzati[0].id;
            }

            // 4. Popolamento Selettore Dropdown
            const select = document.getElementById('eventSelector');
            select.innerHTML = '';
            eventiAutorizzati.forEach(ev => {
                const opt = document.createElement('option');
                opt.value = ev.id;
                opt.textContent = ev.nome || `Evento #${ev.id}`;
                if (String(ev.id) === String(currentEventId)) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            });

            // Gestione Cambio Selezione Evento
            select.addEventListener('change', (e) => {
                const selectedId = e.target.value;
                if (selectedId) {
                    window.location.href = `report-evento.html?event_id=${selectedId}`;
                }
            });

            // 5. Caricamento Dati dell'Evento Selezionato
            await caricaDatiReport(client, currentEventId, eventiAutorizzati);
        }

        async function caricaDatiReport(client, eventId, listaEventi) {
            const eventoCorrente = listaEventi.find(e => String(e.id) === String(eventId));
            
            if (eventoCorrente) {
                document.getElementById('eventTitle').innerText = eventoCorrente.nome || `Evento #${eventoCorrente.id}`;
                document.getElementById('eventSubtitle').innerText = eventoCorrente.data_evento 
                    ? `Data svolgimento: ${new Date(eventoCorrente.data_evento).toLocaleDateString('it-IT')}` 
                    : 'Report dettagliato iscrizioni';
            }

            // Recupero iscrizioni dell'evento selezionato
            const { data: iscrizioni, error } = await client
                .from('iscrizioni')
                .select('*')
                .eq('event_id', eventId);

            const tbody = document.getElementById('reportTableBody');

            if (error) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-danger py-4">
                            Errore nel recupero dati: ${error.message}
                        </td>
                    </tr>`;
                return;
            }

            if (!iscrizioni || iscrizioni.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-muted py-4">
                            Nessun atleta iscritto a questo evento.
                        </td>
                    </tr>`;
                aggiornaKPI([]);
                return;
            }

            // Rendering Tabella Dati
            renderTabella(iscrizioni);
            aggiornaKPI(iscrizioni);
            abilitaRicercaFiltro(iscrizioni);
        }

        function renderTabella(data) {
            const tbody = document.getElementById('reportTableBody');
            tbody.innerHTML = '';

            data.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="fw-semibold">${item.nome_atleta || item.atleta || 'N/D'} ${item.cognome_atleta || ''}</td>
                    <td><i class="fas fa-building text-muted me-1"></i>${item.societa || 'N/D'}</td>
                    <td><span class="badge bg-light text-dark border">${item.categoria || 'N/D'}</span></td>
                    <td>${item.sesso || '-'}</td>
                    <td>${item.peso ? item.peso + ' kg' : '-'}</td>
                    <td class="text-center">
                        <span class="badge-status bg-success bg-opacity-10 text-success">Confermato</span>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function aggiornaKPI(iscrizioni) {
            const totaleAtleti = iscrizioni.length;
            const societaUniche = new Set(iscrizioni.map(i => i.societa).filter(Boolean)).size;
            const categorieUniche = new Set(iscrizioni.map(i => i.categoria).filter(Boolean)).size;

            document.getElementById('statTotalAtleti').innerText = totaleAtleti;
            document.getElementById('statTotalSocieta').innerText = societaUniche;
            document.getElementById('statTotalCategorie').innerText = categorieUniche;
        }

        function abilitaRicercaFiltro(iscrizioni) {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                const filtrati = iscrizioni.filter(i => {
                    const nomeCompleto = `${i.nome_atleta || ''} ${i.cognome_atleta || ''} ${i.atleta || ''}`.toLowerCase();
                    const societa = (i.societa || '').toLowerCase();
                    const categoria = (i.categoria || '').toLowerCase();
                    return nomeCompleto.includes(query) || societa.includes(query) || categoria.includes(query);
                });
                renderTabella(filtrati);
            });
        }
    </script>
</body>
</html>
