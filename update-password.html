<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Aggiorna Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: linear-gradient(45deg, #00ced1, #1e90ff); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">
    <div class="container shadow-lg" style="background: white; padding: 30px; border-radius: 15px; max-width: 400px;">
        <h2 class="text-center mb-3">Nuova Password</h2>
        <p class="text-muted small text-center mb-4">Inserisci il codice a 6 cifre ricevuto via email e la tua nuova password.</p>
        
        <form id="updatePasswordForm">
            <div class="mb-3">
                <label class="form-label fw-bold">Codice OTP (6 cifre)</label>
                <input type="text" id="otpToken" class="form-control text-center fw-bold fs-4" maxlength="6" placeholder="------" style="letter-spacing: 6px;" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Nuova Password</label>
                <input type="password" id="newPassword" class="form-control" placeholder="Minimo 6 caratteri" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Conferma Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Ripeti password" required>
            </div>
            <button type="submit" id="btnUpdate" class="btn btn-primary w-100 fw-bold">Aggiorna Password</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <script>
        // Controlla che l'utente arrivi da una richiesta di recupero valida
        document.addEventListener('DOMContentLoaded', () => {
            const savedEmail = sessionStorage.getItem('resetEmail');
            if (!savedEmail) {
                alert("Nessuna richiesta di recupero attiva. Inserisci prima la tua email.");
                window.location.href = 'recupero.html';
            }
        });

        document.getElementById('updatePasswordForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = sessionStorage.getItem('resetEmail');
            const token = document.getElementById('otpToken').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('btnUpdate');

            if (!email) {
                alert('Sessione scaduta. Richiedi un nuovo codice.');
                window.location.href = 'recupero.html';
                return;
            }

            if (newPassword !== confirmPassword) {
                alert('Le password non corrispondono.');
                return;
            }

            if (token.length !== 6) {
                alert('Il codice OTP deve essere composto esattamente da 6 cifre.');
                return;
            }

            btn.disabled = true;
            btn.innerText = "Verifica e aggiornamento...";

            setTimeout(async () => {
                try {
                    const client = window.supabaseClient || window.sb || window.supabase;
                    if (!client) throw new Error("Client Supabase non inizializzato.");

                    // 1. Verifica il codice OTP di tipo 'recovery'
                    const { error: verifyError } = await client.auth.verifyOtp({
                        email: email,
                        token: token,
                        type: 'recovery'
                    });

                    if (verifyError) throw new Error("Codice non valido o scaduto: " + verifyError.message);

                    // 2. Se la verifica va a buon fine, aggiorna la password
                    const { error: updateError } = await client.auth.updateUser({  
                        password: newPassword  
                    });

                    if (updateError) throw updateError;

                    alert('Password aggiornata con successo! Ora verrai reindirizzato al login.');
                    sessionStorage.removeItem('resetEmail');
                    window.location.href = 'login.html';  
                } catch (error) {
                    alert('Errore: ' + error.message);
                    btn.disabled = false;
                    btn.innerText = "Aggiorna Password";
                }
            }, 0);
        });
    </script>
</body>
</html>
