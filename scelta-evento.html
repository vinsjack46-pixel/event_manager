<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selezione Evento | Gestione Gare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #1e90ff;
            --admin-color: #ffc107;
            --bg-gradient: linear-gradient(135deg, #00ced1 0%, #1e90ff 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            padding: 40px;
            width: 100%;
            max-width: 650px;
            transition: transform 0.3s;
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-section i {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .header-section h2 {
            font-weight: 700;
            color: #2c3e50;
        }

        .event-container {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .event-item {
            background: #f8f9fa;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .event-item:hover {
            background: #ffffff;
            border-color: var(--primary-color);
            box-shadow: 0 5px 15px rgba(30, 144, 255, 0.15);
            transform: translateY(-2px);
        }

        .event-info h5 {
            margin: 0 0 5px 0;
            font-weight: 600;
            color: #2c3e50;
        }

        .event-info small {
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        .btn-select {
            background: var(--primary-color);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .event-item:hover .btn-select {
            background: #007ae6;
        }

        .top-actions {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        /* Custom Scrollbar */
        .event-container::-webkit-scrollbar { width: 6px; }
        .event-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .event-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .event-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="top-actions">
            <button class="btn btn-sm btn-outline-danger" onclick="logout()">
                <i class="fas fa-sign-out-alt me-1"></i> Esci
            </button>
            <a href="admin.html" class="btn btn-sm btn-outline-warning">
                <i class="fas fa-user-shield me-1"></i> Area Admin
            </a>
        </div>

        <div class="header-section">
            <i class="fas fa-trophy"></i>
            <h2>Seleziona Evento</h2>
            <p class="text-muted">Scegli la competizione a cui vuoi iscrivere i tuoi atleti o le deine squadre</p>
        </div>

        <div class="event-container" id="eventsContainer">
            <div class="text-center py-4">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Caricamento...</span>
                </div>
                <p class="text-muted mt-2">Ricerca eventi in corso...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <script>
        const sb = window.supabaseClient;

        async function init() {
            // Verifica se l'utente è autenticato
            const { data: { user } } = await sb.auth.getUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            await caricaEventi();
        }

        async function caricaEventi() {
            // V6.0 FIX CONSOLIDATO: 
            // 1. Usa l'alias "data:data_evento" per mappare la colonna nativa del database
            // 2. Chiede il campo "sport_id" per gestire le regole dinamiche
            // 3. Filtra solo gli eventi attivi (.eq('attivo', true))
            const { data: eventi, error } = await sb
                .from('eventi')
                .select('id, nome, data:data_evento, luogo, sport_id') 
                .eq('attivo', true)
                .order('data_evento', { ascending: true });

            const container = document.getElementById('eventsContainer');
            if (error) {
                container.innerHTML = `<div class="alert alert-danger">Errore nel caricamento degli eventi: ${error.message}</div>`;
                return;
            }

            if (eventi && eventi.length > 0) {
                container.innerHTML = "";
                eventi.forEach(e => {
                    const dataFormattata = new Date(e.data).toLocaleDateString('it-IT', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric'
                    });

                    // Protezione e fallback se sport_id fosse null per vecchi test: assegna 'karate'
                    const sportId = e.sport_id || 'karate';

                    container.innerHTML += `
                        <div class="event-item" onclick="selezionaEvento('${e.id}', '${e.nome.replace(/'/g, "\\'")}', '${sportId}')">
                            <div class="event-info">
                                <h5>${e.nome}</h5>
                                <small><i class="far fa-calendar-alt me-1"></i> ${dataFormattata} • <i class="fas fa-map-marker-alt me-1"></i> ${e.luogo || 'Sede da definire'}</small>
                            </div>
                            <div class="btn-select">
                                <i class="fas fa-chevron-right"></i>
                            </div>
                        </div>
                    `;
                });
            } else {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-calendar-times fa-3x text-muted mb-3"></i>
                        <p class="text-muted">Nessun evento attivo disponibile.</p>
                    </div>`;
            }
        }

        // AGGIORNATO: Memorizza le informazioni e indirizza alla pagina specifica dello sport
        function selezionaEvento(id, nome, sportId) {
            sessionStorage.setItem('selectedEventId', id);
            sessionStorage.setItem('selectedEventName', nome);
            sessionStorage.setItem('selectedSportId', sportId); 
            
            // Converte lo sportId tutto in minuscolo per evitare discrepanze nei nomi dei file
            const formatoSport = sportId.toLowerCase();
            
            // Reindirizzamento dinamico basato sul nome del file strutturato (es. index-judo.html)
            window.location.href = `index-${formatoSport}.html?id=${id}`;
        }

        async function logout() {
            if(confirm("Sei sicuro di voler uscire?")) {
                await sb.auth.signOut();
                window.location.href = 'login.html';
            }
        }

        init();
    </script>
</body>
</html>
